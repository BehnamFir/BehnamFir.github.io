<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#071a35">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <title>Page not found | Behnam Firouzi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      overflow: hidden;
      color: #e7f2fc;
      background:
        radial-gradient(circle at 18% 18%, rgba(63, 155, 222, .25), transparent 30rem),
        radial-gradient(circle at 82% 78%, rgba(44, 204, 174, .18), transparent 28rem),
        #071a35;
      font-family: Inter, system-ui, sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      opacity: .13;
      background-image:
        linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px);
      background-size: 64px 64px;
    }
    main {
      position: relative;
      width: min(100%, 720px);
      padding: clamp(2rem, 6vw, 4.5rem);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 28px;
      background: rgba(7, 26, 53, .72);
      box-shadow: 0 30px 90px rgba(0,0,0,.35);
      backdrop-filter: blur(16px);
      text-align: center;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin: 0 auto 1.5rem;
      border-radius: 15px;
      color: #071a35;
      background: linear-gradient(145deg, #82caff, #4be0c5);
      font-size: .82rem;
      font-weight: 900;
      letter-spacing: .08em;
    }
    .eyebrow {
      margin: 0;
      color: #5ce0c6;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: .25em 0 .2em;
      color: #fff;
      font-family: Georgia, serif;
      font-size: clamp(3.2rem, 14vw, 7.5rem);
      font-weight: 600;
      letter-spacing: -.05em;
      line-height: 1;
    }
    p:not(.eyebrow) {
      max-width: 500px;
      margin: 0 auto;
      color: #afc3d7;
      line-height: 1.7;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      margin-top: 1.6rem;
      padding: .78rem 1rem;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, #174f82, #2878b8);
      box-shadow: 0 12px 28px rgba(28, 103, 166, .28);
      font-size: .82rem;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">BF</div>
    <p class="eyebrow">Error 404</p>
    <h1>Lost wave.</h1>
    <p>The requested page is outside this research portfolio. Return to the main site to browse the profile, research themes, projects, and publication archive.</p>
    <a href="/">Return to the portfolio <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
